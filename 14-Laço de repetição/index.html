<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laços de repetição</title>
</head>
<body>
    <h1>Laços de repetição</h1>
    <p> Os laços de repetição servem para repetir uma ação executando apenas um comando.</p>
    <p>Exemplo: vou digitar os números de 1 a 5000 e vai demorar bastante, mas podemos utilizar um laço de repetição (for):</p>
    <p>1,2,3,4,5</p>
    <p id="contagem"></p>
    Exemplo 2:
    Vamos preencher uma caixa de seleção com anos.
    <p id="anos"></p>
    <select id="ano">
        <option selected disabled> Selecione o ano</option>
    </select>
    <script src="script.js"></script>
</body>
</html>
