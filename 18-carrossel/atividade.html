<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade do Denis</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/minecraft-3');
        body{
            background-color:aqua ;

        }
        h1{
            font-family: 'Minecraft', sans-serif;
            font-size: 5vw;
        }
        .accordion{
            width: 100%;
            background-color: azure;
            color: blue;
            cursor: pointer;
            padding: 18px;
            text-align: left;
            border: none;
            outline: none;
            transition: 0.4s;
            font-size: 3vw;
        }
        .active, .accordion:hover{
            background-color: transparent yellow;
        }
        .panel{
            padding: 0 18px;
            background-color: white;
            display: none;
            overflow: hidden;
        }
        div{
            height: 100px;
            width: 100px;
        }
        p{
            font-size: 3vw;
        }
    </style>
</head>
<body>
    <h1>Olá mundo</h1>
    <button class="accordion">Time do Coração</button>
    <div class="panel">
        <p>Cruzeiro Esporte Clube, multicampeão. Hexacampeão da copa do Brasil e rei de copas.</p>
    </div>
    <button class="accordion">Comida Preferida</button>
    <div class="panel">
        <p>Feijão Tropeiro e Batata frita. Com um suquinho de Limão, hmmmmm</p>
    </div>
    <button class="accordion">Atual Jogo Competitivo</button>
    <div class="panel">
        <p>Overwatch 2: Mestre 1. No passado já alcançou Xerife 2 no CSGO.</p>
    </div>
    <script src="teste.js"></script>
</body>
</html>
